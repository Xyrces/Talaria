name: Talaria CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for MinVer to index repository tags and calculate semantic history

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Personal-refs guard
        # Sprint 6 follow-up: wire scripts/check-personal-refs.sh (vendored by
        # task-12, PR #17) into CI so personal-ref regressions cannot
        # re-introduce after task-11/13/14 land. PERSONAL_REFS_GUARD=warn
        # emits GitHub-Actions ::warning:: annotations but exits 0; flip to
        # deny once the codebase is clean (task-11/13/14 have landed on main
        # but the audit-evidence docs still contain expected hits covered by
        # the exception list). See docs/TASK_11_AUDIT.md and
        # docs/TASK_14_HISTORY_SWEEP_CONFIRMATION.md.
        env:
          PERSONAL_REFS_GUARD: warn
        run: bash scripts/check-personal-refs.sh

      - name: Restore Dependencies
        run: dotnet restore Talaria.slnx

      - name: Build Solution
        run: dotnet build Talaria.slnx --configuration Release --no-restore

      - name: Run Integration Tests
        # Ensure TestContainers can leverage docker locally on the ubuntu runner
        run: dotnet test Talaria.slnx --configuration Release --no-build --verbosity normal

      - name: Audit NuGet Packages for Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Compute PR prerelease version
        # PR builds get an unambiguous, collision-free throwaway version so every
        # push to a PR is consumable from GitHub Packages. Main/tag builds keep
        # MinVer's version (empty arg = MinVer default).
        if: github.event_name == 'pull_request'
        run: echo "PACK_VERSION_ARG=-p:PackageVersion=0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Pack NuGets (--no-build)
        # Reuses the Release build above; adds seconds, not minutes.
        run: |
          dotnet pack src/Talaria.Core/Talaria.Core.csproj -c Release --no-build -o ./out $PACK_VERSION_ARG
          dotnet pack src/Talaria.Transports.Kafka/Talaria.Transports.Kafka.csproj -c Release --no-build -o ./out $PACK_VERSION_ARG
          dotnet pack src/Talaria.StateStores.Redis/Talaria.StateStores.Redis.csproj -c Release --no-build -o ./out $PACK_VERSION_ARG
          dotnet pack src/Talaria.Transports.InMemory/Talaria.Transports.InMemory.csproj -c Release --no-build -o ./out $PACK_VERSION_ARG
          dotnet pack src/Talaria.Transports.AzureServiceBus/Talaria.Transports.AzureServiceBus.csproj -c Release --no-build -o ./out $PACK_VERSION_ARG

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./out/*.nupkg
          retention-days: 1

  publish_prerelease:
    name: Publish PR prerelease to GitHub Packages
    needs: build_test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ./out

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./out/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

  publish:
    name: Pack and Publish
    needs: build_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Restore Dependencies
        run: dotnet restore Talaria.slnx

      - name: Pack NuGets
        run: |
          dotnet pack src/Talaria.Core/Talaria.Core.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.Kafka/Talaria.Transports.Kafka.csproj -c Release -o ./out
          dotnet pack src/Talaria.StateStores.Redis/Talaria.StateStores.Redis.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.InMemory/Talaria.Transports.InMemory.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.AzureServiceBus/Talaria.Transports.AzureServiceBus.csproj -c Release -o ./out

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./out/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

  publish_nuget:
    name: Pack and Publish to NuGet.org
    needs: build_test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore Talaria.slnx

      - name: Pack NuGets
        run: |
          dotnet pack src/Talaria.Core/Talaria.Core.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.Kafka/Talaria.Transports.Kafka.csproj -c Release -o ./out
          dotnet pack src/Talaria.StateStores.Redis/Talaria.StateStores.Redis.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.InMemory/Talaria.Transports.InMemory.csproj -c Release -o ./out
          dotnet pack src/Talaria.Transports.AzureServiceBus/Talaria.Transports.AzureServiceBus.csproj -c Release -o ./out

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "./out/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Skip NuGet.org publish (no API key)
        if: env.NUGET_API_KEY == ''
        run: echo "::warning::NUGET_API_KEY secret is not set; skipping NuGet.org publish. Packages were still packed and published to GitHub Packages."
